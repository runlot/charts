    created: "2026-10-31T02:19:22.750859225Z"
    description: 'Runlot on the customer''s cluster -- one installation per customer,
      no CRDs, the customer holds the master key. Profile `cp-only` puts the control
      plane, git and the dashboard in the cluster and leaves the data plane on VMs
      installed with the runlot-node package; profile `full` adds the data-plane DaemonSet
      and is behind measurement M1. '
